# آیتم فیزیکی لاک‌پیک: یک آیتم سراسری که برای شروع مینی‌گیم لازم است.
# با هر شکست (miss) یک واحد دوامش کم می‌شود و بعد از تمام شدن دوام، آیتم می‌شکند.
lockpick-item:
  material: TRIPWIRE_HOOK
  name: "&eلاک‌پیک"
  lore:
    - "&7برای باز کردن قفل‌های مکانیکی استفاده کن."
  max-uses: 5
  uses-lore-line: "&7دوام: &f{uses}/{max}"
  missing-message: "&cبرای باز کردن قفل باید یک لاک‌پیک سالم در دست داشته باشی."
  break-message: "&cلاک‌پیکت شکست!"
